<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clients Management </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

<nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
    <div class="container-fluid">
        <a class="navbar-brand">Clients Management</a>
        <div class="collapse navbar-collapse" id="navbarScroll">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/add}">Add Client</a>
                </li>
            </ul>>
        </div>
    </div>
    <ul class="navbar-nav">
        <li class="nav-item">
            <a class="nav-link active">Logout</a>
        </li>
    </ul>
</nav>

<div th:if="${persons != null and !persons.empty}">
    <table class="table" border="1">
        <tr>
            <th>Name: </th>
            <th>Lastname: </th>
            <th>Email: </th>
            <th>Phone: </th>
            <th></th>
            <th></th>
        </tr>
        <tr th:each="p : ${persons}">
            <td th:text="${p.name}"></td>
            <td th:text="${p.lastname}"></td>
            <td th:text="${p.email}"></td>
            <td th:text="${p.number}"></td>
            <td><a type="button" class="btn btn-outline-primary" th:href="@{/edit/} + ${p.id}" th:text="Edit"/></td>
            <td><a type="button" class="btn btn-outline-danger" th:href="@{/delete(id=${p.id})}" th:text="Delete"/></td>
        </tr>
    </table>
</div>

</div>
<div th:if="${persons == null or persons.empty}"> The list is empty. </div>
</body>
</html>
