<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Client</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

<nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand" th:href="@{/}">Back</a>
  </div>
</nav>

<form class="row g-3" th:action="@{/save}" method="post" th:object="${person}">
  <input type="hidden" name="idPerson" th:field="*{id}">

  <div class="col-md-4">
    <label class="form-label" for="name">Name </label>
    <input class="form-control" type="text" name="name" th:field="*{name}">
    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error in name </span>
  </div>

  <div class="col-md-4">
    <label class="form-label" for="lastname">Lastname </label>
    <input class="form-control" type="text" name="lastname" th:field="*{lastname}">
    <span th:if="${#fields.hasErrors('lastname')}" th:errors="*{lastname}">Error in lastname</span>
  </div>

  <div class="col-md-4">
    <label class="form-label" for="age">Age </label>
    <input class="form-control" type="number" name="age" th:field="*{age}">
    <span th:if="${#fields.hasErrors('age')}" th:errors="*{age}">Error in age</span>
  </div>

  <div class="col-md-4">
    <label class="form-label" for="email">Email </label>
    <input class="form-control" type="email" name="email" th:field="*{email}">
    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error in email</span>
  </div>

  <div class="col-md-4">
    <label class="form-label" for="number">Phone number </label>
    <input class="form-control" type="number" name="number" th:field="*{number}">
    <span th:if="${#fields.hasErrors('number')}" th:errors="*{number}">Error in number</span>
  </div>

  <div class="col-12">
    <input class="btn btn-primary" type="submit" name="Save" value="Save">
  </div>
</form>

</body>
</html>
